services:
  postgres:
    image: postgres:16
    container_name: nestora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nestora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nestora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nestora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nestora_redis_data:/data

volumes:
  nestora_postgres_data:
  nestora_redis_data:
