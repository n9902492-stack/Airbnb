services:
  postgres:
    image: postgres:16-alpine
    container_name: nestora-postgres
    environment:
      POSTGRES_DB: nestora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nestora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nestora_postgres_data:
