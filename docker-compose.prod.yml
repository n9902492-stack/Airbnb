services:
  migrate:
    build: ./backend
    env_file:
      - ./backend/.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      JOB_WORKER_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/health/ready'); raise SystemExit(0 if r.status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: ["python", "-m", "src.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nestora}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nestora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nestora}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nestora_redis_data:/data

volumes:
  nestora_postgres_data:
  nestora_redis_data:
